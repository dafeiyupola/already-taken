[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "already-taken"
version = "0.2.0"
description = "Check whether an open-source issue already has someone on it"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dafeiyupola" }]
keywords = ["github", "issues", "open-source", "contributing", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
]

[project.scripts]
already-taken = "already_taken:main"

[tool.setuptools]
py-modules = ["already_taken"]
